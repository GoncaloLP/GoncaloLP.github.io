<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gonçalo's Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  </head>
  <body>

    <nav class="navbar navbar-expand-xl navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Gonçalo's Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBasic" aria-controls="navbarBasic" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarBasic">
          <ul class="navbar-nav me-auto mb-2 mb-xl-0">
            <li class="nav-item">
              <button class="nav-link" type="button" data-bs-toggle="modal" data-bs-target="#projectsModal">Projects</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" type="button" data-bs-toggle="modal" data-bs-target="#aboutModal">About me</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" type="button" data-bs-toggle="modal" data-bs-target="#cvModal">Curriculum Vitae</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <canvas id="scene" aria-label="3D desk with a computer. Click the monitor to open the menu." role="img"></canvas>

    <!-- Menu: abre ao clicar no monitor -->
    <div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="menuModalLabel">Projects</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row h-100 g-3">

              <div class="col-md-4">
                <div class="card h-90">
                  <div class="card-body">
                    <h5 class="card-title">Projects</h5>
                    <p class="card-text">Here are all my projects.</p>
                    <a href="#" class="card-link" data-bs-toggle="modal" data-bs-target="#projectsModal">Check projects</a>
                  </div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="card h-90">
                  <div class="card-body">
                    <h5 class="card-title">About Me</h5>
                    <p class="card-text">A little section about me.</p>
                    <a href="#" class="card-link" data-bs-toggle="modal" data-bs-target="#aboutModal">About me</a>
                  </div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="card h-90">
                  <div class="card-body">
                    <h5 class="card-title">CV</h5>
                    <p class="card-text">Here's my CV</p>
                    <a href="#" class="card-link" data-bs-toggle="modal" data-bs-target="#cvModal">Check out the CV</a>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Secção: Projects -->
    <div class="modal fade" id="projectsModal" tabindex="-1" aria-labelledby="projectsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="projectsModalLabel">Projects</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- EDITAR: conteúdo de Projects -->
            <p>Os meus projetos.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Secção: About me -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="aboutModalLabel">About me</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- EDITAR: conteúdo de About me -->
            <p>Um pouco sobre mim.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Secção: Curriculum Vitae -->
    <div class="modal fade" id="cvModal" tabindex="-1" aria-labelledby="cvModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="cvModalLabel">Curriculum Vitae</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <!-- EDITAR: conteúdo de Curriculum Vitae -->
            <p>O meu CV.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
